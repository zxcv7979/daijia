# P1 本地演示配置。修改后由进程内观察者热加载，无需重启。
# 真实采集默认关闭。官方适配器必须保持 enabled: false。

live:
  collection_enabled: false
  # 真实源默认关闭。即使改成 true，进程内仍要二次确认才会进入可注册状态。
  real_source: false

server:
  host: 127.0.0.1
  port: 8787

adapters:
  sim_replay:
    enabled: true
    samples_dir: data/samples
    default_replay: replay.jsonl
    default_speed: 1
    speeds: [1, 5, 20]
    loop: false
  official:
    # 必须保持关闭。没有登录、签名、Cookie 或平台接口实现。
    enabled: false
    mode: stub
    contract: ""
    credential_env: ""
  governance:
    queue_max: 4000
    dedup_window_sec: 30
    heartbeat_interval_sec: 1
    heartbeat_timeout_sec: 3
    backoff_base_sec: 0.2
    backoff_factor: 2
    backoff_cap_sec: 5
    stable_after_sec: 2
    # 队列满时丢掉最旧的一条，腾出位置给新事件，并记告警。
    drop_policy: drop_oldest

normalize:
  dedup_window_sec: 30
  combo_merge_window_ms: 800
  # 同文弹幕聚合窗口固定 200ms，不允许改成 2s。
  danmaku_aggregate_window_ms: 200
  ts_bucket_ms: 100

emotion:
  rise_ms: 220
  hold_ms: 1200
  decay_half_life_s: 6
  max_on_screen: 8
  ducking:
    enabled: true
  cooldowns_ms:
    L0: 200
    L1: 300
    L2: 1000
    L3: 3000
    L4: 6000

print_show:
  default_duration_sec: 45
  show_min_sec: 30
  show_max_sec: 60
  progress_cues: [25, 50, 75, 90, 100]
  # 介于 L3(5) 与 L4(8) 之间：里程碑能打断中礼物，但不能抢走榜一主情绪。
  cue_priority: 6
  cue_hold_ms: 800
  grain: 0.45
  camera_orbit: 1.0
  reveal_lights: 1.0
  # 只有全息可以插到正在打印的任务后面，不能把热床上的那一件挤掉。
  queue_jump: true
  jump_min_style: hologram
  cue_table:
    25:
      emotion: hype
      intensity: 0.45
      fx: print_progress_25
    50:
      emotion: hype
      intensity: 0.62
      fx: print_progress_50
    75:
      emotion: awe
      intensity: 0.78
      fx: print_progress_75
    90:
      emotion: awe
      intensity: 0.9
      fx: print_progress_90
      beat: hold_breath
      hold_ms: 1600
    100:
      emotion: joy
      intensity: 0.97
      fx: print_progress_100
      beat: burst
      hold_ms: 900

bus:
  reconnect_buffer_sec: 30

avatar:
  photo_retention_days: 7
  seed: 42
  gpu_enabled: false
  cloud_api: false

# OBS 浏览器源读这份配置，改完不用重新构建页面。
overlay:
  width: 1920
  height: 1080
  transparent: true
  target_fps: 60
  frame_budget_ms: 12
  max_fx: 8
  max_particles: 20000
  downshift_after_frames: 8
  recover_after_frames: 45
  recover_under_ms: 10
  mute: false
  # 值为空表示不播放。把音频放到 apps/overlay/public/sfx/ 后写成 /overlay/sfx/礼物.mp3
  sfx:
    gift_pop: ""
    print_cartoon: ""
    print_hologram: ""
    bangyi_rank1: ""
    danmaku_float: ""
    print_progress_90: ""
    print_progress_100: ""
  # 循环背景音乐，空字符串表示不播放。素材放在 apps/overlay/public/assets/。
  bgm: "/overlay/assets/bgm.m4a"
  bgm_volume: 0.3
